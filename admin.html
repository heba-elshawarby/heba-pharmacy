<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b55"><title>إدارة الطلبات | صيدلية د. هبه الشواربي</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8f6;color:#18352d;font-family:Tahoma,Arial}.top{background:#176b55;color:#fff;padding:24px 16px}.wrap{max-width:1000px;margin:auto;padding:16px}.panel{background:white;border:1px solid #dce9e3;border-radius:16px;padding:16px;margin:14px 0}.form{display:grid;gap:10px;max-width:480px}.form input,.form select{padding:12px;border:1px solid #cbdad2;border-radius:9px;width:100%}button{border:0;background:#176b55;color:white;padding:11px 15px;border-radius:9px;cursor:pointer;font-weight:bold}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:right;padding:10px;border-bottom:1px solid #e5eee9;vertical-align:top}th{background:#edf6f1}.scroll{overflow:auto}.muted{color:#657b72;font-size:13px}.hidden{display:none}.order{border:1px solid #dce9e3;border-radius:12px;padding:12px;margin:10px 0;background:#fff}pre{white-space:pre-wrap;word-break:break-word}
</style></head><body><header class="top"><div class="wrap"><h1>لوحة إدارة الطلبات</h1><p>صيدلية د. هبه الشواربي</p></div></header><main class="wrap"><section id="login" class="panel"><h2>دخول الإدارة</h2><p class="muted">استخدم البريد وكلمة المرور للحساب الذي أضفته إلى جدول الإدارة في Supabase.</p><div class="form"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" onclick="login()">تسجيل الدخول</button><div id="loginMsg" class="muted"></div></div></section><section id="dashboard" class="hidden"><div class="panel"><button onclick="loadOrders()">تحديث الطلبات</button> <button onclick="logout()">تسجيل الخروج</button><p class="muted" id="state">يتم تحميل الطلبات...</p></div><div id="orders"></div></section></main><script>
const U='https://hggwmyqxwgqrcckyboof.supabase.co',K='sb_publishable_HVkyu5uHtpXkJfZPvQdAgA_MjgdX5Wv';let session=null,timer=null;const $=id=>document.getElementById(id);function headers(extra={}){return {apikey:K,Authorization:'Bearer '+(session?.access_token||K),'Content-Type':'application/json',...extra}}async function login(){let btn=$('loginBtn');btn.disabled=true;$('loginMsg').textContent='جاري التحقق...';try{let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});let d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||'تعذر تسجيل الدخول');session=d;let check=await fetch(U+'/rest/v1/orders?select=id&limit=1',{headers:headers()});if(check.status===401||check.status===403)throw Error('تم تسجيل الدخول، لكن صلاحيات الإدارة غير مفعّلة لهذا الحساب.');$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadOrders();timer=setInterval(loadOrders,12000)}catch(e){session=null;$('loginMsg').textContent=e.message||'تعذر تسجيل الدخول'}finally{btn.disabled=false}}async function loadOrders(){if(!session)return;try{let r=await fetch(U+'/rest/v1/orders?select=*&order=created_at.desc&limit=100',{headers:headers()});let data=await r.json();if(!r.ok)throw Error(data.message||data.details||'تعذر تحميل الطلبات');$('state').textContent='عدد الطلبات المعروضة: '+data.length+' — يتم التحديث تلقائيًا كل 12 ثانية';$('orders').innerHTML=data.length?data.map(o=>`<article class="order"><b>طلب #${esc(o.id)}</b> <span class="muted">${esc(o.created_at||'')}</span><p><b>العميل:</b> ${esc(o.customer_name)} — ${esc(o.customer_phone)}</p><p><b>العنوان:</b> ${esc(o.address||'غير محدد')}</p><p><b>المحتويات:</b> ${esc(JSON.stringify(o.items||[]))}</p><p><b>الإجمالي:</b> ${esc(o.total??0)} ج.م</p><p><b>ملاحظات:</b> ${esc(o.notes||'لا توجد')}</p><label>حالة الطلب <select id="s-${esc(o.id)}"><option value="new" ${o.status==='new'?'selected':''}>طلب جديد</option><option value="preparing" ${o.status==='preparing'?'selected':''}>قيد التجهيز</option><option value="ready" ${o.status==='ready'?'selected':''}>جاهز</option><option value="with_delivery" ${o.status==='with_delivery'?'selected':''}>مع مندوب التوصيل</option><option value="delivered" ${o.status==='delivered'?'selected':''}>تم التسليم</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>ملغي</option></select></label> <button onclick="updateStatus('${esc(o.id)}')">حفظ الحالة</button></article>`).join(''):'<div class="panel">لا توجد طلبات حتى الآن.</div>'}catch(e){$('state').textContent='تعذر تحميل الطلبات: '+e.message}}async function updateStatus(id){let status=$('s-'+id).value;try{let r=await fetch(U+'/rest/v1/orders?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:headers({Prefer:'return=minimal'}),body:JSON.stringify({status,updated_at:new Date().toISOString()})});if(!r.ok)throw Error(await r.text());$('state').textContent='تم تحديث حالة الطلب #'+id;await loadOrders()}catch(e){alert('لم يتم تحديث الحالة: '+e.message)}}function logout(){session=null;if(timer)clearInterval(timer);$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
