<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<meta name="description" content="تطبيق صيدلية د. هبه الشواربي لطلب الأدوية">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>صيدلية د. هبه الشواربي</title>
<style>
:root{--n:#102a43;--p:#d83b82;--bg:#f6f8fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial;color:#183044}
.top{background:linear-gradient(135deg,#102a43,#1769aa);color:#fff;padding:22px 16px 28px;border-radius:0 0 28px 28px}
.wrap{max-width:900px;margin:auto;padding:16px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:55px;height:55px;background:white;border-radius:16px;display:grid;place-items:center;color:var(--p);font-size:31px;font-weight:bold}
.brand h1{font-size:20px;margin:0}
.brand p{margin:5px 0;font-size:12px;color:#dbe8f2}
.hero{margin-top:22px}
.hero h2{margin:0 0 7px;font-size:25px}
.hero p{margin:0;font-size:13px;color:#dbe8f2}
.search{margin-top:18px;background:#fff;padding:8px;border-radius:16px;display:flex;gap:8px}
.search input{flex:1;border:0;background:#f4f6f8;border-radius:11px;padding:13px;outline:0}
.search button,.send{border:0;background:var(--p);color:white;border-radius:11px;padding:11px 16px;font-weight:bold}
.chips{display:flex;gap:8px;overflow:auto;margin:15px 0}
.chip{white-space:nowrap;border:1px solid #e0e7ed;background:white;border-radius:999px;padding:9px 14px;color:var(--n)}
.chip.active{background:#fff0f6;border-color:#e8a9c6;color:#a5225f}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;border:1px solid #e6ebf0;border-radius:18px;padding:12px;box-shadow:0 6px 18px #102a4310}
.pic{height:125px;background:#f7f9fb;border-radius:13px;display:grid;place-items:center;font-size:38px;color:#c8d1d9;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain}
.name{font-weight:bold;line-height:1.45;margin-top:9px;min-height:40px}
.sub{font-size:11px;color:#687b8b;margin-top:4px;min-height:16px}
.price{font-weight:bold;color:var(--n);margin-top:7px}
.avail{font-size:11px;color:#17865b;margin-top:4px}
.add{width:100%;margin-top:9px;padding:10px;border:0;border-radius:11px;background:var(--n);color:#fff;font-weight:bold}
.add:disabled{background:#aeb8c1}
.bar{position:sticky;bottom:12px;margin-top:18px;background:var(--n);color:white;padding:12px 14px;border-radius:17px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 28px #102a4350}
.bar button{border:0;background:var(--p);color:white;padding:10px 15px;border-radius:10px;font-weight:bold}
.badge{background:#fff;color:var(--p);border-radius:50%;min-width:24px;height:24px;display:inline-grid;place-items:center}
.modal{display:none;position:fixed;inset:0;background:#071b2aaa;z-index:5;align-items:flex-end;padding:10px}
.modal.show{display:flex}
.sheet{background:#fff;width:min(600px,100%);max-height:92vh;overflow:auto;border-radius:24px;padding:18px}
.close{float:left;border:0;background:#edf1f4;border-radius:9px;width:36px;height:36px}
.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e7edf2;padding:11px 0}
.qty button{border:0;background:#edf1f4;border-radius:8px;width:30px;height:30px}
.form{display:grid;gap:10px;margin-top:16px}
.form label{font-size:12px;font-weight:bold}
.form input,.form textarea{width:100%;margin-top:5px;border:1px solid #dfe6ec;border-radius:11px;padding:11px}
.form textarea{min-height:70px}
.empty{text-align:center;color:#718392;padding:35px;grid-column:1/-1}
.success{text-align:center;padding:25px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}

.auth-gate{position:fixed;inset:0;z-index:20;background:linear-gradient(145deg,#102a43,#1769aa);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.auth-panel{width:min(460px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px #001a3344}
.auth-brand{text-align:center;margin-bottom:20px}.auth-logo{width:64px;height:64px;border-radius:18px;background:#fff0f6;color:#d83b82;display:grid;place-items:center;font-size:34px;margin:0 auto 10px}
.auth-tabs{display:flex;gap:8px;margin:16px 0}.auth-tabs button{flex:1;border:1px solid #dfe6ec;background:#f6f8fb;border-radius:11px;padding:11px;font-weight:bold;color:#102a43}.auth-tabs button.active{background:#d83b82;color:white;border-color:#d83b82}
.auth-panel input{width:100%;padding:12px;border:1px solid #dfe6ec;border-radius:11px;margin:5px 0 12px;font:inherit}.auth-panel label{font-size:13px;font-weight:bold}.auth-panel .send{width:100%;margin-top:8px}.auth-msg{font-size:13px;line-height:1.6;margin-top:12px;color:#b42318}.auth-msg.ok{color:#16734a}
body.locked{overflow:hidden}

/* Professional blue-white-pink pharmacy theme */
:root{--n:#0755b8;--p:#f20c69;--bg:#f5f9ff;--ink:#15345b;--blue:#0866cf;--pale:#eaf4ff}
body{background:linear-gradient(180deg,#fff 0,#f5f9ff 60%,#fff 100%);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
.top{background:#fff;color:var(--n);padding:0;border-radius:0;border-bottom:1px solid #dbeaff;box-shadow:0 4px 18px #0755b80a}
.wrap{max-width:1320px;margin:auto;padding:18px}
.top .wrap{padding:16px 22px 20px}
.brand{gap:14px}
.logo{width:76px;height:76px;flex:0 0 76px;background:#fff;border:2px solid #f3d5e2;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:var(--p);font-size:28px;box-shadow:0 4px 16px #0755b815}
.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:25px;color:#0755b8;font-weight:900}
.brand p{color:#f20c69;font-size:14px;font-weight:bold}
.hero{margin-top:18px;padding:28px 30px;border-radius:22px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;background:radial-gradient(circle at 8% 20%,#ffffff 0 12%,transparent 13%),linear-gradient(105deg,#eaf4ff 0%,#fff 53%,#eaf4ff 100%);border:1px solid #dcecff;position:relative;overflow:hidden}
.hero:after{content:"✚";position:absolute;left:7%;top:8px;font-size:150px;line-height:1;color:#0870d20d;font-weight:bold}
.hero h2{font-size:clamp(25px,3vw,38px);color:#0755b8;margin:0 0 10px;position:relative;z-index:1}
.hero p{font-size:16px;color:#47658a;position:relative;z-index:1}
.search{margin-top:20px;background:#f1f6fd;border:1px solid #dce9f8;padding:7px;border-radius:16px;max-width:760px}
.search input{background:#fff;border:1px solid #e1ebf8;font-size:15px}
.search button,.send{background:var(--p);color:#fff;border-radius:12px;padding:12px 18px;box-shadow:0 5px 12px #f20c6922}
main.wrap{padding-top:22px}
.chips{gap:10px;margin:18px 0;flex-wrap:wrap}
.chip{border:1px solid #dbe8f8;background:#fff;border-radius:13px;padding:11px 18px;color:#0755b8;font-weight:bold}
.chip.active{background:#0755b8;border-color:#0755b8;color:white}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border:1px solid #e0ebf8;border-radius:20px;box-shadow:0 8px 24px #0755b80b}
.pic{height:150px;background:linear-gradient(145deg,#f7fbff,#edf5ff);border:1px solid #edf3fb}
.name{color:#174477;font-size:15px}
.price{color:#0755b8;font-size:16px}
.avail{color:#16845d}
.add{background:#0755b8;border-radius:12px;padding:12px}
.add:hover{background:#06479b}
.bar{background:#0755b8;border-radius:18px;box-shadow:0 10px 26px #0755b82e}
.bar button{background:#f20c69}
.badge{color:#f20c69;font-weight:bold}
.modal{background:#082345b8}
.sheet{border:1px solid #dce9f8;box-shadow:0 20px 70px #001a3344}
.auth-gate{background:linear-gradient(140deg,#0755b8,#0d76dc 65%,#f20c69)}
.auth-panel{border:1px solid #dce9f8;box-shadow:0 25px 80px #001a3344}
.auth-logo{overflow:hidden;border:1px solid #f3d5e2;background:#fff}
.auth-tabs button{color:#0755b8}
.auth-tabs button.active{background:#f20c69;border-color:#f20c69}
.auth-panel .send{background:#f20c69}
#customerWelcome{border-right:4px solid #f20c69}
#status{background:#eaf4ff;border:1px solid #dbeaff;border-radius:12px;padding:12px!important}
#myOrders .card{box-shadow:none}
@media(min-width:850px){
 .top .wrap{display:grid;grid-template-columns:1fr;gap:0}
 .top .brand{align-items:center}
 .hero{min-height:245px;padding:36px 42px}
 .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
 main.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
 main.wrap>.chips,main.wrap>#status,main.wrap>#customerWelcome,main.wrap>div.card,main.wrap>#grid,main.wrap>.bar{grid-column:1/-1}
 main.wrap>#grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:600px){
 .top .wrap{padding:14px}
 .logo{width:60px;height:60px;flex-basis:60px}
 .brand h1{font-size:20px}
 .hero{padding:22px 18px;min-height:185px}
 .hero h2{font-size:25px}
 .hero p{font-size:13px}
 .wrap{padding:12px}
 .pic{height:120px}
 .grid{gap:10px}
 .card{padding:10px}
 .name{font-size:13px}
 .add{font-size:12px;padding:10px 6px}
}
</style>
</head>
